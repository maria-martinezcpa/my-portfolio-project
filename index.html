<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="David Nguyen: BIM modeling, GIS integration and BIM software. Revit models, construction drawings, georeferencing and automation." />
    <meta name="theme-color" content="#4f46e5" />
    <title>David Nguyen | BIM Modeler, GIS &amp; Software Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;700&display=swap"
    />
    <script>
      // Apply the saved theme before first paint (keys match src/theme.ts).
      ;(function () {
        var ids = ['light', 'dark', 'blueprint', 'concrete', 'timber', 'aurora']
        var t = 'system'
        try {
          t = localStorage.getItem('portfolio-theme') || 'system'
        } catch (e) {}
        if (t === 'system' || ids.indexOf(t) < 0) {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
